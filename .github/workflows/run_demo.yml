name: QuantumGuarder Demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run demo
      run: python examples/run_demo.py
    
    - name: Upload result
      uses: actions/upload-artifact@v3
      with:
        name: noise-cancellation-result
        path: noise_cancellation_demo.png
